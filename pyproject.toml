[project]
name = "fin"
version = "0.2.0"
description = "Rocket fin stability & flutter design tool (Barrowman + fin flutter boundary + optimizer, Flask API, 3D viewer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fin contributors" }]
dependencies = [
    "Flask>=3.0,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "rocket_physics", "schemas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is a soft guideline here, not a hard failure
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # fixtures/imports pulled in for pytest side-effects

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app", "rocket_physics", "schemas"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
